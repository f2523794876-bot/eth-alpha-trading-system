name: V1.4D full PostgreSQL and replay verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_verification:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eth_alpha_v14d_test
          POSTGRES_USER: v14d_test
          POSTGRES_PASSWORD: v14d_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v14d_test -d eth_alpha_v14d_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://v14d_test:v14d_test_only@127.0.0.1:5432/eth_alpha_v14d_test
      V14D_REPLAY_DATABASE_URL: postgresql://v14d_test:v14d_test_only@127.0.0.1:5432/eth_alpha_v14d_test
      V14D_DATASET_VERSION: ${{ vars.V14D_DATASET_VERSION }}
      V14D_ALGORITHM_VERSION: ${{ vars.V14D_ALGORITHM_VERSION }}
      V14D_RULE_VERSION: ${{ vars.V14D_RULE_VERSION }}
      V14D_WEIGHT_VERSION: ${{ vars.V14D_WEIGHT_VERSION }}
      V14D_EVALUATION_VERSION: ${{ vars.V14D_EVALUATION_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - name: Require full verification configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in V14D_DATASET_VERSION V14D_ALGORITHM_VERSION V14D_RULE_VERSION V14D_WEIGHT_VERSION V14D_EVALUATION_VERSION; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for full V1.4D verification"
              exit 3
            fi
          done
      - name: Run full PostgreSQL, 7-day, 90-day and scorecard verification
        working-directory: server
        run: npm run verify:v1.4d -- --replay-days=both
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-4d-full-verification
          path: |
            server/v1-4d-verification-report.json
            server/v1-4d-verification-report.md
            server/v1-4d-postgres-validation-results.json
            server/v1-4d-research-scorecard*.json
            server/v1-4d-research-scorecard*.md
          if-no-files-found: warn
